# Optional edge proxy. Run server.mjs on 127.0.0.1:8080 (or use Compose).
# Configure TLS and server_name for your host; see README for trusted proxies.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    keepalive_timeout 15;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        client_max_body_size 1k;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($content_length !~ "^(0)?$") { return 400; }

        # Node supplies security headers, static allowlists, per-client quotas,
        # fixed external destinations and bounded in-memory response caching.
        # No external API may bypass Node through a direct proxy_pass location.
        location / {
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/baiye-proxy.conf;
        }
    }
}
