# This file replaces /etc/nginx/nginx.conf in the supplied container.
# A single worker is sufficient for a personal startpage on a small VPS.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    access_log off;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Change these DNS servers if your host requires its own resolver.
    resolver 223.5.5.5 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_cache_path /var/cache/nginx/baiye levels=1:2 keys_zone=baiye:2m max_size=128m inactive=30d use_temp_path=off;
    limit_req_zone $binary_remote_addr zone=api:1m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    map $uri $baiye_csp {
        default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://www.bing.com; connect-src 'self' https://www.bing.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action https://www.baidu.com https://www.google.com https://www.bing.com";
        ~^/api/ "default-src 'none'; frame-ancestors 'none'; sandbox";
    }
    map $uri $baiye_disposition {
        default "";
        /api/image-proxy 'attachment; filename="wallpaper.jpg"';
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1k;
        limit_conn connections 20;
        limit_conn_status 429;
        limit_req_status 429;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Baiye-Cache $upstream_cache_status always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy $baiye_csp always;
        add_header Content-Disposition $baiye_disposition always;

        # Serve only application assets, even if source or backup files are copied here.
        location = / {
            limit_except GET HEAD { deny all; }
            try_files /index.html =404;
            expires -1;
        }
        location ~ ^/(index\.html|app\.js|core\.js|images\.js|network\.js|styles\.css|favicon\.svg|third-party-notices\.txt|license\.txt)$ {
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
            expires -1;
        }
        location / { return 404; }

        # Compatibility for older cached pages: redirect instead of sending image bytes.
        location = /assets/fallback.jpg {
            return 302 https://www.bing.com/th?id=OHR.DolbadarnWales_ZH-CN3649667806_1920x1080.jpg;
        }
        location ~ /\. { deny all; }

        # Fixed upstreams only. These endpoints cannot be used as an open proxy.
        location = /api/bing {
            limit_req zone=api burst=20 nodelay;
            limit_except GET HEAD { deny all; }
            set $bing_host www.bing.com;
            set $baiye_upstream_uri "/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=zh-CN";
            set $baiye_accept application/json;
            proxy_pass https://$bing_host$baiye_upstream_uri;
            include /etc/nginx/baiye-proxy.conf;
            proxy_cache_valid 200 15m;
        }

        location = /api/image {
            limit_req zone=api burst=20 nodelay;
            limit_except GET HEAD { deny all; }
            if ($arg_id !~ "^OHR\.[a-zA-Z0-9_-]+_(1920x1080|1280x720|400x240)\.jpg$") { return 400; }
            if ($arg_id ~ ".{151}") { return 400; }
            # The browser downloads the image from Bing using the user's connection.
            return 302 https://www.bing.com/th?id=$arg_id;
        }

        # Used only after explicit per-load consent or enabling the fallback setting.
        # Cache images so many users do not repeat the same upstream download.
        location = /api/image-proxy {
            limit_req zone=api burst=20 nodelay;
            limit_except GET HEAD { deny all; }
            if ($arg_id !~ "^OHR\.[a-zA-Z0-9_-]+_(1920x1080|1280x720|400x240)\.jpg$") { return 400; }
            if ($arg_id ~ ".{151}") { return 400; }
            set $bing_host www.bing.com;
            set $baiye_upstream_uri "/th?id=$arg_id";
            set $baiye_accept "image/jpeg,image/png,image/webp,image/avif,image/gif";
            proxy_pass https://$bing_host$baiye_upstream_uri;
            include /etc/nginx/baiye-proxy.conf;
            proxy_cache_valid 200 30d;
        }

        location = /api/weather {
            limit_req zone=api burst=20 nodelay;
            limit_except GET HEAD { deny all; }
            if ($arg_latitude !~ "^-?([0-8]?[0-9](\.[0-9]{1,6})?|90(\.0{1,6})?)$") { return 400; }
            if ($arg_longitude !~ "^-?([0-9]?[0-9](\.[0-9]{1,6})?|1[0-7][0-9](\.[0-9]{1,6})?|180(\.0{1,6})?)$") { return 400; }
            set $weather_host api.open-meteo.com;
            set $baiye_upstream_uri "/v1/forecast?latitude=$arg_latitude&longitude=$arg_longitude&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
            set $baiye_accept application/json;
            proxy_pass https://$weather_host$baiye_upstream_uri;
            include /etc/nginx/baiye-proxy.conf;
            proxy_cache_valid 200 30m;
        }

        location = /api/geocode {
            limit_req zone=api burst=20 nodelay;
            limit_except GET HEAD { deny all; }
            if ($arg_name = "") { return 400; }
            if ($arg_name ~ ".{601}") { return 400; }
            set $geocode_host geocoding-api.open-meteo.com;
            set $baiye_upstream_uri "/v1/search?name=$arg_name&count=6&language=zh&format=json";
            set $baiye_accept application/json;
            proxy_pass https://$geocode_host$baiye_upstream_uri;
            include /etc/nginx/baiye-proxy.conf;
            proxy_cache_valid 200 1d;
        }

        location /api/ { return 404; }
    }
}
