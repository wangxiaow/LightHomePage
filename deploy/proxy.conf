# This proxy must be listed by exact peer IP in Node's TRUSTED_PROXIES.
# Overwrite incoming identity; never use $proxy_add_x_forwarded_for here.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Accept-Encoding "";
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_send_timeout 5s;

# Node buffers only validated, size-limited responses. Do not write a second
# cache or response spool to disk, or key responses on client-controlled Vary.
proxy_cache off;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_request_buffering off;
proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
