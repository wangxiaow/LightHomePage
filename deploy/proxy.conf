proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 4;
proxy_connect_timeout 5s;
proxy_read_timeout 12s;
proxy_send_timeout 5s;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host $proxy_host;
proxy_set_header User-Agent BaiyeStartpage/0.1.0-Alpha;
proxy_set_header Accept $baiye_accept;
proxy_set_header Content-Length "";
proxy_set_header Connection "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Accept-Encoding "";
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Disposition;
proxy_hide_header X-Accel-Redirect;
proxy_cache baiye;
proxy_cache_key "$proxy_host$baiye_upstream_uri";
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering;
