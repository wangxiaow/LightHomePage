services:
  homepage:
    build: .
    ports:
      - "${BAIYE_BIND_IP:-127.0.0.1}:${BAIYE_PORT:-8080}:8080"
    environment:
      TRUSTED_PROXIES: "${BAIYE_TRUSTED_PROXIES:-}"
      BAIYE_ICP_NUMBER: "${BAIYE_ICP_NUMBER:-}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
