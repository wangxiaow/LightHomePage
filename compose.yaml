services:
  homepage:
    build: .
    ports:
      - "${BAIYE_BIND_IP:-127.0.0.1}:${BAIYE_PORT:-8080}:80"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    volumes:
      - wallpaper-cache:/var/cache/nginx/baiye
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  wallpaper-cache:
